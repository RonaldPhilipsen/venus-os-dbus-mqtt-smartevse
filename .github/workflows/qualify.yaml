name: 'Qualify'

on:
  pull_request:
    types: [opened, edited, synchronize, labeled, unlabeled]
    branches: [main]
  push:
    branches-ignore:
      - main

concurrency:
  group: 'qualify-${{ github.ref }}'
  cancel-in-progress: true

permissions: {}

jobs:
  test:
    name: test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ['3.8', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: install pytest
        run: pip install pytest
      - name: run tests
        run: python -m pytest -q
      - name: check shell scripts
        run: |
          git ls-files -z '*.sh' 'service/run' 'service/log/run' \
            | xargs -0 -n1 bash -n

  semVersie:
    name: semVersie
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # add the version label to the PR
      issues: write # create the label in the repository
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # semVersie needs the full history
          persist-credentials: false
      - name: semVersie
        uses: RonaldPhilipsen/semVersie@d9fb879058f41166c1b18f7974eaed5620dd596b # v2.3.6
        with:
          add-pr-label: true
