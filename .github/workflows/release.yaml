name: 'Release'

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  version:
    name: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release: ${{ steps.semVersie.outputs.release }}
      release-notes: ${{ steps.semVersie.outputs.release-notes }}
      prerelease: ${{ steps.semVersie.outputs.prerelease }}
      tag: ${{ steps.semVersie.outputs.tag }}
      version: ${{ steps.semVersie.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: semVersie
        name: semVersie
        uses: RonaldPhilipsen/semVersie@d9fb879058f41166c1b18f7974eaed5620dd596b # v2.3.6
        with:
          release-notes-format: .github/release-format.md

  release:
    name: Create Release
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and the tag
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ needs.version.outputs.tag }}
      RELEASE_NOTES: ${{ needs.version.outputs.release-notes }}
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: build zip
        run: scripts/build-zip.sh "$VERSION" dbus-smartevse.zip
      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s\n' "$RELEASE_NOTES" > "$RUNNER_TEMP/notes.md"
          args=()
          if [ "$PRERELEASE" = 'true' ]; then
            args+=(--prerelease)
          fi
          gh release create "$TAG" dbus-smartevse.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            "${args[@]}"
