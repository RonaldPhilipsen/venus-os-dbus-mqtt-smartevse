[DEFAULT]
# Device instance number on D-Bus
DeviceInstance = 43
# Name shown in the Victron GUI and VRM
CustomName = SmartEVSE
# Minutes between sign-of-life log lines
SignOfLifeLog = 10
# Nominal mains voltage in volts, used to compute current from power
NominalVoltage = 230
# Position: 0 = AC output, 1 = AC input
Position = 1
# Set to 1 if the SmartEVSE reports its own energy meter values
HasEVMeter = 1

[MQTT]
# MQTT broker host name or IP address (required)
Host = 192.168.1.10
# MQTT broker port
Port = 1883
# Broker user name, empty for none
Username =
# Broker password, empty for none
Password =
# Topic prefix of the SmartEVSE (required)
TopicPrefix = SmartEVSE/51446
# Seconds without MQTT data before the charger counts as offline
OfflineTimeoutSeconds = 60

[BATTERY]
# Set to 1 to publish the battery feed to the SmartEVSE
Enabled = 1
# Seconds between battery updates
IntervalSeconds = 10

[GRID]
# Set to 1 to publish the grid feed to the SmartEVSE
Enabled = 0
# Seconds between grid updates
IntervalSeconds = 2
